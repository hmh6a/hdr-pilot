name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build, test and verify portable release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?)$') { throw 'Invalid release tag' }
          ./scripts/Package.ps1 -Version $Matches[1]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hdr-pilot-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish tested Windows package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hdr-pilot-win-x64
          path: release
      - name: Verify checksum and publish GitHub release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check *.sha256
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          cat > release-notes.txt <<'NOTES'
          Windows 11 x64 portable release. Extract the ZIP and run HDRPilot.exe; no separate .NET installation is needed.

          The package includes the browser companion, diagnostics and SHA-256 checksums. This build is unsigned. See README.md for compatibility and hardware-validation limits.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --title "HDR Pilot $RELEASE_TAG" --notes-file release-notes.txt --generate-notes "${prerelease[@]}" HDRPilot-*.zip HDRPilot-*.zip.sha256
